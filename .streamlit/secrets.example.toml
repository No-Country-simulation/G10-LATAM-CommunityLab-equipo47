# Copia este archivo a .streamlit/secrets.toml y rellena los valores.
# .streamlit/secrets.toml NO se versiona (ya está en .gitignore).
[oci]
user = "ocid1.user.oc1..REEMPLAZAR"
fingerprint = "REEMPLAZAR"
tenancy = "ocid1.tenancy.oc1..REEMPLAZAR"
region = "REEMPLAZAR"
namespace = "REEMPLAZAR"
bucket = "REEMPLAZAR"

# Usa key_content o key_file, no ambos.
# La clave debe ser PEM en formato PKCS#8 (BEGIN PRIVATE KEY) o RSA (BEGIN RSA PRIVATE KEY).
key_content = """-----BEGIN PRIVATE KEY-----
REEMPLAZAR
-----END PRIVATE KEY-----"""

# key_file = "C:/ruta/a/tu/clave.pem"
